name: Android TV test APK
on:
  push:
    branches: [android-tv-test-apk]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build test APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: UAPlay-Android-TV-test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Put APK at a direct download path on the isolated branch
        run: |
          mkdir -p android/apk
          cp android/app/build/outputs/apk/debug/app-debug.apk android/apk/UAPlay-Android-TV-test.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/apk/UAPlay-Android-TV-test.apk
          git commit -m "build(android): publish installable test apk [skip ci]"
          git push origin HEAD:android-tv-test-apk
