name: Publish UAPlay with NSP

on:
  workflow_run:
    workflows: ["Build native UAPlay with libmpv"]
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful main run ID for Build native UAPlay with libmpv
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    concurrency:
      group: uaplay-release
      cancel-in-progress: false
    steps:
      - name: Verify the selected build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.build_run_id }}
        run: |
          set -eu
          case "$BUILD_RUN_ID" in
            ''|*[!0-9]*) exit 1 ;;
          esac
          source_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" | jq -er '
            select(.path == ".github/workflows/build.yml" and
                   .head_branch == "main" and .conclusion == "success" and
                   .head_repository.full_name == .repository.full_name)
            | .head_sha | select(test("^[0-9a-f]{40}$"))
          ')"
          # Never publish an older build if another commit has reached main.
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$source_sha" != "$main_sha" ]; then
            echo "Skipping outdated build $source_sha (main is $main_sha)."
            exit 1
          fi
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.build.outputs.sha }}
      - name: Download NRO from the exact successful main build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -eu
          mkdir -p dist
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name UAPlay-native --dir dist
          test -s dist/UAPlay.nro
          test -s .release/UAPlay.nsp
      - name: Verify NSP forwarder target
        run: |
          set -eu
          if ! grep -aFq 'sdmc:/switch/UAPlay.nro' .release/UAPlay.nsp; then
            echo "::error::NSP does not point to sdmc:/switch/UAPlay.nro"
            exit 1
          fi
          sha256sum dist/UAPlay.nro .release/UAPlay.nsp
      - name: Publish versioned UAPlay release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.build.outputs.sha }}
        run: |
          set -eu
          test -f source/version.h || exit 0
          version="$(awk -F '"' '/^#define UAPLAY_VERSION / { print $2 }' source/version.h)"
          printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          tag="UAPlay_$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already published."
            exit 0
          fi
          gh release create "$tag" \
            dist/UAPlay.nro .release/UAPlay.nsp#UAPlay.nsp \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "UAPlay $version" \
            --notes-file .release/RELEASE_NOTES.md
