name: Publish UAPlay 0.5.0.3 stable release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-stable.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish UAPlay_0.5.0.3 stable release'
    runs-on: ubuntu-24.04
    steps:
      - name: Download the previously successful Switch build
        uses: actions/download-artifact@v4
        with:
          name: UAPlay-native
          run-id: 42880658932
          github-token: ${{ github.token }}

      - name: Verify the NRO asset is present
        run: test -s UAPlay.nro

      - name: Publish the stable release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            Стабільний випуск UAPlay для Nintendo Switch.

            - Оновлено головний екран: горизонтальні добірки фільмів, серіалів, мультфільмів та мультсеріалів.
            - Кнопка «Більше» відкриває повний каталог; фокус доступний із крайнього правого постера.
            - На постерах відображається числовий рейтинг TMDB.
            - У картці фільму додано тривалість, у картці серіалу — кількість сезонів і серій.
            - «Вибране» розділено на «На майбутнє» й «Історія» з можливістю очищення історії.
            - Покращено керування джойстиком, інтерфейс та оформлення світлої й темної тем.
        run: |
          set -euo pipefail
          if gh release view UAPlay_0.5.0.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'UAPlay_0.5.0.3 already exists; refusing to overwrite it.'
            exit 1
          fi
          gh release create UAPlay_0.5.0.3 ./UAPlay.nro \
            --repo "$GITHUB_REPOSITORY" \
            --target 59001626a13b47adf6aa20979bdcca63978b6b9d \
            --title 'UAPlay_0.5.0.3' \
            --notes "$RELEASE_NOTES" \
            --latest
