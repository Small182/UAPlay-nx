name: Retire superseded UAPlay 0.5.9 release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete only the superseded 0.5.9 release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view UAPlay_0.5.9 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete UAPlay_0.5.9 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
