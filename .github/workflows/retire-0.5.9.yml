name: Retire superseded UAPlay 0.5.9 release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  retire:
    if: github.event.head_commit.message == 'chore: retire UAPlay 0.5.9 release'
    runs-on: ubuntu-24.04
    steps:
      - name: Delete only the superseded 0.5.9 release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release delete UAPlay_0.5.9 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
